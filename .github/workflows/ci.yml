name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            race: -race
          - os: macos-14
            race: ""
          - os: windows-2022
            race: ""
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.27"
      # Includes the e2e suite (three daemon processes, large-file kill tests),
      # which takes about 5 minutes on a fast machine.
      - run: go vet ./...
      - run: go test ${{ matrix.race }} -timeout 30m ./...
      - name: Cross-compile without cgo
        if: matrix.os == 'ubuntu-24.04'
        run: |
          CGO_ENABLED=0 GOOS=windows go build ./...
          CGO_ENABLED=0 GOOS=darwin go build ./...

  desktop:
    name: desktop (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - name: Install GTK and WebKit
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # main.go embeds frontend/dist, so the frontend is built before go vet/test.
      # frontend/wailsjs is not needed for that build; wails build generates it.
      - name: Build and test the frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build
          npm test -- --run
      - name: Vet and test the desktop Go code
        working-directory: desktop
        run: |
          go vet -tags webkit2_41 .
          go test -tags webkit2_41 .
      - name: Build the desktop app
        working-directory: desktop
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          wails build -tags webkit2_41
