name: release

# Runs only when a version tag is pushed. The only credential is GITHUB_TOKEN.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  cli:
    name: sugar-it archives and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.27"
      - uses: goreleaser/goreleaser-action@v6.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: sugar-it-desktop (${{ matrix.name }})
    needs: cli
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            build: wails build -tags webkit2_41
            asset: sugar-it-desktop_linux_amd64
            from: build/bin/sugar-it-desktop
          - name: macos
            os: macos-14
            build: wails build -platform darwin/universal
            asset: sugar-it-desktop_macos_universal.zip
            from: build/bin/sugar-it-desktop.app
          - name: windows
            os: windows-2022
            build: wails build -platform windows/amd64 -nsis
            asset: sugar-it-desktop_windows_amd64_installer.exe
            from: build/bin/sugar-it-desktop-amd64-installer.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - name: Install GTK and WebKit
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install NSIS
        if: matrix.name == 'windows'
        run: choco install nsis -y --no-progress
      - name: Install Wails
        # proxy.golang.org has dropped downloads on the hosted runners; retry them.
        run: |
          for attempt in 1 2 3 4 5; do
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1 && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 30
          done
      - name: Build
        working-directory: desktop
        run: ${{ matrix.build }}
      - name: Package the asset
        working-directory: desktop
        run: |
          set -e
          case "${{ matrix.name }}" in
            macos) ditto -c -k --keepParent "${{ matrix.from }}" "${{ matrix.asset }}" ;;
            *) cp "${{ matrix.from }}" "${{ matrix.asset }}" ;;
          esac
          test -s "${{ matrix.asset }}"
      - name: Upload to the release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ matrix.asset }}" --clobber
