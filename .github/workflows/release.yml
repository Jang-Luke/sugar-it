name: release

# Runs when a version tag is pushed by hand, and from auto-release.yml: a tag pushed
# with GITHUB_TOKEN starts no workflow, so that one calls this directly. Each job
# checks out the tag and uses TAG, because GITHUB_REF_NAME is main in a called run.
# The only credential is GITHUB_TOKEN.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_call:
    inputs:
      tag:
        description: The existing tag to build and publish.
        type: string
        required: true

permissions:
  contents: read

jobs:
  cli:
    name: sugar-it archives and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.27"
      - uses: goreleaser/goreleaser-action@v6.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Names the tag when more than one points at this commit.
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
      # The app finds updates through /releases/latest, which skips drafts and
      # pre-releases. A plain version must therefore come out as a full release.
      - name: Check that a plain version is a full release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            state=$(gh release view "$TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease]|join(" ")')
            if [ "$state" != "false false" ]; then
              echo "::error::$TAG is not a full release (draft, prerelease: $state)"
              exit 1
            fi
          fi

  desktop:
    name: sugar-it-desktop (${{ matrix.name }})
    needs: cli
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            build: wails build -tags webkit2_41
            asset: sugar-it-desktop_linux_amd64
            from: build/bin/sugar-it-desktop
          - name: macos
            os: macos-14
            build: wails build -platform darwin/universal
            asset: sugar-it-desktop_macos_universal.zip
            from: build/bin/sugar-it-desktop.app
          - name: windows
            os: windows-2022
            build: wails build -platform windows/amd64 -nsis
            asset: sugar-it-desktop_windows_amd64_installer.exe
            from: build/bin/sugar-it-desktop-amd64-installer.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - name: Install GTK and WebKit
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install NSIS
        if: matrix.name == 'windows'
        run: choco install nsis -y --no-progress
      - name: Install Wails
        # proxy.golang.org has dropped downloads on the hosted runners; retry them.
        run: |
          for attempt in 1 2 3 4 5; do
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1 && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 30
          done
      - name: Build
        working-directory: desktop
        run: ${{ matrix.build }} -ldflags "-X main.version=${TAG#v}"
      - name: Package the asset
        working-directory: desktop
        run: |
          set -e
          case "${{ matrix.name }}" in
            macos) ditto -c -k --keepParent "${{ matrix.from }}" "${{ matrix.asset }}" ;;
            *) cp "${{ matrix.from }}" "${{ matrix.asset }}" ;;
          esac
          test -s "${{ matrix.asset }}"
          bash ../.github/scripts/write-sha256.sh "${{ matrix.asset }}"
      - name: Upload to the release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber
